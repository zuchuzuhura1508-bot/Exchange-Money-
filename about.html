<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>About — Hatua 2</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <header>
    <h2>Zuchu Exchange System</h2>
  </header>

  <div class="container">
    <h3>Tafadhali Wasilisha Maelezo Yako Hapa</h3>
    
    <form>
      <!-- Majina Yako Kamili -->
      <label for="fullname">Majina Yako Kamili</label>
      <input id="fullname" name="fullname" type="text" placeholder="John Doe" required>

      <!-- Nambari Ya Simu -->
      <label for="phone">Nambari Ya Simu</label>
      <input id="phone" name="phone" type="tel" placeholder="07xx xxx xxx" required>

      <!-- Miaka -->
      <label for="age">Miaka</label>
      <input id="age" name="age" type="number" min="1" max="120" placeholder="Umri wako" required>

      <!-- Kazi/Ajira -->
      <label for="job">Kazi/Ajira</label>
      <input id="job" name="job" type="text" placeholder="Kazi yako" required>

      <!-- Mkoa/Wilaya -->
      <label for="county">Mkoa/Wilaya</label>
      <input id="county" name="county" type="text" placeholder="Mkoa au Wilaya yako" required>

      <div class="nav-buttons">
        <button id="backBtn">← Kurudi</button>
        <button id="nextBtn">Endelea →</button>
      </div>
    </form>
  </div>

</body>
</html>
